name: changerelease
on:
  workflow_dispatch: {}
  push:
    paths: [CHANGELOG.md]
    branches: [master]
    tags: ["*"]

permissions:
  contents: write

jobs:
  sync:
    # The release commit's tag does not exist yet when this runs, so the
    # nextrelease workflow syncs that release after it pushes the tag.
    if: ${{ github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release version ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: dropseed/changerelease@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          changelog: CHANGELOG.md
